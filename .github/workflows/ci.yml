# One pipeline ending in "Pipeline Complete", the only required check (estate convention).
# ONE job: GitHub bills each job rounded up to a full minute, so checks are steps, not jobs.
# `task check` is everything CI runs, so local and CI cannot drift.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  pipeline-complete:
    name: Pipeline Complete
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Go modules come through the estate's package proxy, which never serves a
      # version published less than 7 days ago (JorisJonkers-dev/workspace#167).
      # A pull request from a fork gets no secret, and then this step does nothing.
      - uses: JorisJonkers-dev/github-workflows/actions/setup-package-proxy@2814b76fc3f5bd4f02a6e4a0fa789f1307757daa # v0.45.4
        with:
          require-package-proxy: true
          token: ${{ secrets.PACKAGES_PROXY_TOKEN }}

      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: true

      - name: Check
        run: mise exec -- task check
